<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting | MARACHEKKU NATURALS</title>
  <script>
    (function() {
      var hash = window.location.hash;
      var search = window.location.search;
      if (hash === '#contact' || hash === '#bulk-enquiry' || search) {
        window.location.replace('contact.html' + search + hash);
      } else {
        window.location.replace('about.html' + hash);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="about.html">About Us</a> or <a href="contact.html">Contact Us</a>...</p>
</body>
</html>
