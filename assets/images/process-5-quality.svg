    <text x="187" y="48" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="1.2">BATCH QUALITY REGISTER</text>

    <!-- Checklist Items -->
    <g transform="translate(32, 88)" font-family="sans-serif" font-size="13" fill="#2B1E16">
      <circle cx="14" cy="10" r="10" fill="#1E3A2B"/>
      <path d="M9,10 L13,14 L20,6" fill="none" stroke="#FAF6EE" stroke-width="2"/>
      <text x="36" y="15" font-weight="bold">Natural Aroma &amp; Characteristic Flavour</text>

      <g transform="translate(0, 48)">
        <circle cx="14" cy="10" r="10" fill="#1E3A2B"/>
