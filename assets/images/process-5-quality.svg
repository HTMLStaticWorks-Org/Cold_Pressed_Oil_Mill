      <line x1="45" y1="140" x2="62" y2="140"/>
      <line x1="45" y1="180" x2="68" y2="180"/>
      <line x1="45" y1="220" x2="62" y2="220"/>
      <line x1="45" y1="260" x2="68" y2="260"/>
    </g>
    <rect x="15" y="325" width="115" height="16" rx="6" fill="#FFFFFF"/>
