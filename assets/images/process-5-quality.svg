      <stop offset="0%" stop-color="#F4ECE0"/>
      <stop offset="100%" stop-color="#DDD0BC"/>
    </linearGradient>
    <filter id="procShadow5" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2B1E16" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#procBg5)"/>
  <rect x="0" y="420" width="800" height="140" fill="#C8B69C"/>

  <!-- Glass Clarity Inspection Cylinder & Decanter -->
  <g filter="url(#procShadow5)" transform="translate(135, 115)">
