        <path d="M9,10 L13,14 L20,6" fill="none" stroke="#FAF6EE" stroke-width="2"/>
        <text x="36" y="15" font-weight="bold">Seed Cake (Punnakku) Dryness Check</text>
      </g>

      <g transform="translate(0, 144)">
