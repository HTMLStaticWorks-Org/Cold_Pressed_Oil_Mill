<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgSesame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EDE0"/>
      <stop offset="60%" stop-color="#E7D8C3"/>
      <stop offset="100%" stop-color="#D5C2A7"/>
    </linearGradient>
    <linearGradient id="oilSesame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2AC29"/>
      <stop offset="45%" stop-color="#C97812"/>
      <stop offset="85%" stop-color="#9B5108"/>
      <stop offset="100%" stop-color="#703603"/>
    </linearGradient>
    <radialGradient id="glowSesame" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#FFD466" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C97812" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#703603" stop-opacity="0"/>
    </radialGradient>
    <filter id="prodShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2B1E16" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgSesame)"/>
  <circle cx="400" cy="390" r="260" fill="#FFFDF8" opacity="0.5"/>

  <!-- Stone Plinth -->
  <g filter="url(#prodShadow2)" transform="translate(130, 600)">
    <path d="M30,0 H510 L540,42 H0 Z" fill="#E8DEC9"/>
    <rect x="0" y="42" width="540" height="85" rx="4" fill="#CDBBA0"/>
    <line x1="0" y1="42" x2="540" y2="42" stroke="#FAF6EE" stroke-width="2"/>
  </g>

  <!-- Artisanal Round-Shouldered Bottle of Sesame (Gingelly) Oil -->
  <g filter="url(#prodShadow2)" transform="translate(275, 105)">
    <rect x="94" y="0" width="62" height="36" rx="8" fill="#2B1E16"/>
    <rect x="100" y="36" width="50" height="18" fill="#C8922B"/>
    <path d="M95,54 H155 V118 C155,152 232,168 238,235 V495 C238,522 216,540 188,540 H62 C34,540 12,522 12,495 V235 C18,168 95,152 95,118 Z" fill="url(#oilSesame)" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="125" cy="380" rx="78" ry="125" fill="url(#glowSesame)"/>
    <ellipse cx="125" cy="120" rx="29" ry="6" fill="#FFE082"/>
    <path d="M30,240 V485" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.45"/>
    <path d="M220,240 V485" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35"/>

    <!-- Branded Label -->
    <g transform="translate(38, 250)">
      <rect x="0" y="0" width="174" height="215" rx="6" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="2"/>
      <rect x="6" y="6" width="162" height="203" rx="3" fill="none" stroke="#C8922B" stroke-width="1"/>
      <rect x="16" y="18" width="142" height="22" rx="3" fill="#1E3A2B"/>
      <text x="87" y="33" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="1.5">MARACHEKKU NATURALS</text>
      <circle cx="87" cy="68" r="16" fill="#F2EAD9" stroke="#C8922B" stroke-width="1.5"/>
      <path d="M87,57 C87,57 80,65 80,70 C80,74 83,77 87,77 C91,77 94,74 94,70 C94,65 87,57 87,57 Z" fill="#C97812"/>
      <text x="87" y="108" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16.5" font-weight="bold">SESAME OIL</text>
      <text x="87" y="127" text-anchor="middle" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="11.5">Traditional Nallennai</text>
      <line x1="40" y1="140" x2="134" y2="140" stroke="#C8922B" stroke-width="1.2"/>
      <text x="87" y="158" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="9" letter-spacing="1">WOOD-PRESSED • UNREFINED</text>
      <text x="87" y="175" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="8.5">With Natural Palm Jaggery</text>
      <rect x="52" y="186" width="70" height="18" rx="9" fill="#F2EAD9"/>
      <text x="87" y="198" text-anchor="middle" fill="#1E3A2B" font-family="sans-serif" font-size="9" font-weight="bold">1 LITRE</text>
    </g>
  </g>

  <!-- Palm Jaggery (Karupatti) Cubes & Black/White Sesame Seeds -->
  <g filter="url(#prodShadow2)" transform="translate(175, 582)">
    <!-- Palm Jaggery Block -->
    <polygon points="15,35 55,15 95,30 85,58 30,62" fill="#4A2812" stroke="#331A0A" stroke-width="1.5"/>
    <polygon points="55,15 95,30 85,42 45,28" fill="#63381B"/>
    <!-- Brass Bowl of Black & White Sesame -->
    <g transform="translate(340, 12)">
      <path d="M0,12 H105 L92,48 H13 Z" fill="#C8922B"/>
      <ellipse cx="52" cy="12" rx="52" ry="12" fill="#2B211B"/>
      <ellipse cx="66" cy="12" rx="34" ry="8" fill="#EFE3CC"/>
    </g>
  </g>
</svg>

