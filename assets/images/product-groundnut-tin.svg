<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgTin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE2"/>
      <stop offset="100%" stop-color="#DFCGB3"/>
    </linearGradient>
    <linearGradient id="tinMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8B9A6"/>
      <stop offset="25%" stop-color="#F5EFE6"/>
      <stop offset="60%" stop-color="#DDD2C2"/>
      <stop offset="100%" stop-color="#9E8F7C"/>
    </linearGradient>
    <linearGradient id="goldTinTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7019"/>
      <stop offset="40%" stop-color="#ECC366"/>
      <stop offset="100%" stop-color="#875E12"/>
    </linearGradient>
    <filter id="tinShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#F2EAD9"/>
  <rect x="0" y="610" width="800" height="190" fill="#D5C4AC"/>

  <!-- 15L / 5L Bulk Food-Grade Tin Container -->
  <g filter="url(#tinShadow)" transform="translate(150, 145)">
    <!-- Handle & Spout Cap -->
    <path d="M120,25 V5 H200 V25" fill="none" stroke="#875E12" stroke-width="8" stroke-linecap="round"/>
    <rect x="225" y="12" width="42" height="22" rx="4" fill="#1E3A2B"/>
    <!-- Tin Body -->
    <rect x="10" y="32" width="300" height="455" rx="10" fill="url(#tinMetal)" stroke="#B5A48E" stroke-width="2"/>
    <rect x="6" y="28" width="308" height="16" rx="4" fill="url(#goldTinTop)"/>
    <rect x="6" y="475" width="308" height="16" rx="4" fill="url(#goldTinTop)"/>
    <!-- Ribbed Structural Lines -->
    <line x1="12" y1="120" x2="308" y2="120" stroke="#B5A48E" stroke-width="3"/>
    <line x1="12" y1="395" x2="308" y2="395" stroke="#B5A48E" stroke-width="3"/>

    <!-- Wrap-Around Brand Label on Tin -->
    <rect x="26" y="145" width="268" height="225" rx="6" fill="#1E3A2B" stroke="#C8922B" stroke-width="2.5"/>
    <text x="160" y="182" text-anchor="middle" fill="#C8922B" font-family="Georgia, serif" font-size="11" font-weight="bold" letter-spacing="2">MARACHEKKU NATURALS</text>
    <line x1="60" y1="195" x2="260" y2="195" stroke="#C8922B" stroke-width="1" stroke-opacity="0.5"/>
    <text x="160" y="232" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="22" font-weight="bold">COLD-PRESSED</text>
    <text x="160" y="260" text-anchor="middle" fill="#F7C948" font-family="Georgia, serif" font-size="18" font-weight="bold">CULINARY OIL</text>
    <text x="160" y="288" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="11" letter-spacing="1">FOOD-GRADE BULK PACK</text>
    <rect x="95" y="312" width="130" height="32" rx="16" fill="#C8922B"/>
    <text x="160" y="333" text-anchor="middle" fill="#2B1E16" font-family="sans-serif" font-size="12" font-weight="bold">5L / 15L TIN CAN</text>
  </g>

  <!-- Companion 500ml Retail Glass Bottle Next to Tin -->
  <g filter="url(#tinShadow)" transform="translate(500, 290)">
    <rect x="58" y="0" width="44" height="26" rx="5" fill="#2B1E16"/>
    <path d="M60,26 H100 V78 C100,98 152,115 158,155 V320 C158,338 144,350 124,350 H36 C16,350 2,338 2,320 V155 C8,115 60,98 60,78 Z" fill="#E5A220" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="22" y="172" width="116" height="135" rx="4" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="1.5"/>
    <text x="80" y="205" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="8" font-weight="bold" letter-spacing="1">MARACHEKKU</text>
    <text x="80" y="232" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="13" font-weight="bold">RETAIL BOTTLE</text>
    <text x="80" y="255" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="9">500 ML • 1 LITRE</text>
  </g>
</svg>

