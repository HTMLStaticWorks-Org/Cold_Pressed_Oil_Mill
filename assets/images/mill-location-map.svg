<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE6D5"/>
      <stop offset="100%" stop-color="#E2D4BC"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E3A2B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#mapBg)"/>

  <!-- Decorative Topographic & Agricultural Contour Zones -->
  <path d="M0,120 Q220,90 410,165 T900,110 L900,0 L0,0 Z" fill="#E5DAC5"/>
  <path d="M0,360 Q310,310 560,390 T900,340 L900,480 L0,480 Z" fill="#D8C8AE" opacity="0.6"/>
  <ellipse cx="220" cy="280" rx="140" ry="75" fill="#DCE3D1" opacity="0.65"/>
  <ellipse cx="690" cy="180" rx="155" ry="85" fill="#DCE3D1" opacity="0.65"/>

  <!-- Grid Lines -->
  <g stroke="#C8B89E" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="360" x2="900" y2="360"/>
  </g>

  <!-- Regional Roads & Highways -->
  <path d="M0,295 Q280,260 450,240 T900,175" fill="none" stroke="#FAF6EE" stroke-width="12"/>
  <path d="M0,295 Q280,260 450,240 T900,175" fill="none" stroke="#C8922B" stroke-width="3"/>
  <path d="M310,0 Q395,180 450,240 T560,480" fill="none" stroke="#FAF6EE" stroke-width="9"/>
  <path d="M310,0 Q395,180 450,240 T560,480" fill="none" stroke="#B59E7A" stroke-width="2"/>

  <!-- Regional Labels -->
  <text x="175" y="250" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="13">Coconut &amp; Groundnut Belt</text>
  <text x="640" y="145" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="13">Kangeyam • Pollachi Corridor</text>
  <text x="110" y="325" fill="#5A4A3E" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">NH-81 / SH-21 MILL ROAD</text>

  <!-- Center Mill Marker Pin & Card -->
  <g filter="url(#pinShadow)" transform="translate(450, 240)">
    <circle cx="0" cy="0" r="34" fill="#C8922B" opacity="0.25"/>
    <circle cx="0" cy="0" r="18" fill="#1E3A2B" stroke="#FAF6EE" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#C8922B"/>

    <!-- Location Info Card -->
    <g transform="translate(-165, -135)">
      <rect x="0" y="0" width="330" height="98" rx="10" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="2"/>
      <polygon points="155,98 175,98 165,112" fill="#1E3A2B"/>
      <text x="165" y="28" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="15" font-weight="bold">MARACHEKKU NATURALS OIL MILL</text>
      <text x="165" y="50" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="12">42/B, Traditional Mill Road, Kangeyam Belt</text>
      <text x="165" y="70" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="11.5">Tiruppur / Coimbatore Region, Tamil Nadu 638701</text>
      <text x="165" y="87" text-anchor="middle" fill="#C8922B" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">MILL VISITS &amp; BULK DISPATCH GATE</text>
    </g>
  </g>
</svg>

