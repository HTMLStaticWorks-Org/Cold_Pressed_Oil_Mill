<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgCoconut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="60%" stop-color="#EFE8DA"/>
      <stop offset="100%" stop-color="#DFD4C0"/>
    </linearGradient>
    <linearGradient id="oilCoconut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="45%" stop-color="#F7EAB8"/>
      <stop offset="85%" stop-color="#E5CA78"/>
      <stop offset="100%" stop-color="#C8A94E"/>
    </linearGradient>
    <filter id="prodShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2B1E16" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgCoconut)"/>
  <circle cx="400" cy="390" r="260" fill="#FFFFFF" opacity="0.65"/>

  <!-- Stone Plinth -->
  <g filter="url(#prodShadow3)" transform="translate(130, 600)">
    <path d="M30,0 H510 L540,42 H0 Z" fill="#F2ECE1"/>
    <rect x="0" y="42" width="540" height="85" rx="4" fill="#DCD0BC"/>
    <line x1="0" y1="42" x2="540" y2="42" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Clear Artisanal Bottle of Cold-Pressed Coconut Oil -->
  <g filter="url(#prodShadow3)" transform="translate(275, 105)">
    <rect x="92" y="0" width="66" height="36" rx="8" fill="#3D2618"/>
    <rect x="98" y="36" width="54" height="18" fill="#5C7052"/>
    <path d="M94,54 H156 V125 C156,150 225,175 235,228 V495 C235,522 214,540 186,540 H64 C36,540 15,522 15,495 V228 C25,175 94,150 94,125 Z" fill="url(#oilCoconut)" stroke="#FFFFFF" stroke-width="3.5"/>
    <ellipse cx="125" cy="126" rx="30" ry="6" fill="#FFFFFF"/>
    <path d="M32,235 V485" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-opacity="0.7"/>
    <path d="M218,235 V485" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Branded Forest-Green & Cream Label -->
    <g transform="translate(38, 250)">
      <rect x="0" y="0" width="174" height="215" rx="6" fill="#1E3A2B" stroke="#C8922B" stroke-width="2"/>
      <rect x="6" y="6" width="162" height="203" rx="3" fill="none" stroke="#FAF6EE" stroke-width="0.8" stroke-opacity="0.4"/>
      <rect x="16" y="18" width="142" height="22" rx="3" fill="#FAF6EE"/>
      <text x="87" y="33" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="1.5">MARACHEKKU NATURALS</text>
      <circle cx="87" cy="68" r="16" fill="#294D3A" stroke="#C8922B" stroke-width="1.5"/>
      <path d="M87,57 C87,57 80,65 80,70 C80,74 83,77 87,77 C91,77 94,74 94,70 C94,65 87,57 87,57 Z" fill="#FAF6EE"/>
      <text x="87" y="108" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="16.5" font-weight="bold">COCONUT OIL</text>
      <text x="87" y="127" text-anchor="middle" fill="#C8922B" font-family="Georgia, serif" font-style="italic" font-size="11.5">Thengai Ennai</text>
      <line x1="40" y1="140" x2="134" y2="140" stroke="#C8922B" stroke-width="1.2"/>
      <text x="87" y="158" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="9" letter-spacing="1">WOOD-PRESSED • UNREFINED</text>
      <text x="87" y="175" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="8.5">Sulfur-Free Sun-Dried Copra</text>
      <rect x="52" y="186" width="70" height="18" rx="9" fill="#C8922B"/>
      <text x="87" y="198" text-anchor="middle" fill="#2B1E16" font-family="sans-serif" font-size="9" font-weight="bold">1 LITRE</text>
    </g>
  </g>

  <!-- Split Fresh Coconut Half in Foreground -->
  <g filter="url(#prodShadow3)" transform="translate(475, 548)">
    <path d="M10,45 C10,108 160,108 160,45 Z" fill="#4E311D"/>
    <ellipse cx="85" cy="45" rx="75" ry="26" fill="#FAF6EE" stroke="#5E3C24" stroke-width="5"/>
    <ellipse cx="85" cy="45" rx="54" ry="16" fill="#E6DDD0"/>
  </g>
</svg>

