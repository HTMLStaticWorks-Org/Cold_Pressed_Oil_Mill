<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgOther" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F0E4"/>
      <stop offset="60%" stop-color="#E6DAC4"/>
      <stop offset="100%" stop-color="#D2C1A5"/>
    </linearGradient>
    <linearGradient id="oilAlmond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D55B"/>
      <stop offset="50%" stop-color="#DCA024"/>
      <stop offset="100%" stop-color="#A36E0B"/>
    </linearGradient>
    <linearGradient id="oilNeem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A9A3A"/>
      <stop offset="50%" stop-color="#58691E"/>
      <stop offset="100%" stop-color="#36420E"/>
    </linearGradient>
    <filter id="prodShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgOther)"/>
  <circle cx="400" cy="390" r="260" fill="#FFFDF8" opacity="0.5"/>

  <!-- Plinth -->
  <g filter="url(#prodShadow6)" transform="translate(110, 600)">
    <path d="M30,0 H550 L580,42 H0 Z" fill="#EFE6D5"/>
    <rect x="0" y="42" width="580" height="85" rx="4" fill="#D5C4A9"/>
    <line x1="0" y1="42" x2="580" y2="42" stroke="#FAF6EE" stroke-width="2"/>
  </g>

  <!-- Bottle 1 (Left): Sweet Almond / Badam Oil -->
  <g filter="url(#prodShadow6)" transform="translate(165, 165)">
    <rect x="74" y="0" width="52" height="30" rx="6" fill="#3D2618"/>
    <rect x="79" y="30" width="42" height="14" fill="#C8922B"/>
    <path d="M75,44 H125 V98 C125,118 182,138 190,182 V440 C190,462 172,478 148,478 H52 C28,478 10,462 10,440 V182 C18,138 75,118 75,98 Z" fill="url(#oilAlmond)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M25,190 V430" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.5"/>
    <g transform="translate(28, 210)">
      <rect x="0" y="0" width="144" height="185" rx="5" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="1.8"/>
      <rect x="12" y="14" width="120" height="18" rx="2" fill="#1E3A2B"/>
      <text x="72" y="26" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="7.5" font-weight="bold" letter-spacing="1.2">MARACHEKKU NATURALS</text>
      <text x="72" y="76" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="13.5" font-weight="bold">SWEET ALMOND</text>
      <text x="72" y="94" text-anchor="middle" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="10.5">Badam Ennai</text>
      <line x1="30" y1="108" x2="114" y2="108" stroke="#C8922B" stroke-width="1"/>
      <text x="72" y="128" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="8" letter-spacing="0.8">COLD-PRESSED • PURE</text>
      <text x="72" y="162" text-anchor="middle" fill="#1E3A2B" font-family="sans-serif" font-size="8.5" font-weight="bold">250 ML / 500 ML</text>
    </g>
  </g>

  <!-- Bottle 2 (Right): Traditional Neem & Iluppai Oil -->
  <g filter="url(#prodShadow6)" transform="translate(425, 165)">
    <rect x="74" y="0" width="52" height="30" rx="6" fill="#2B1E16"/>
    <rect x="79" y="30" width="42" height="14" fill="#5C7052"/>
    <path d="M75,44 H125 V98 C125,118 182,138 190,182 V440 C190,462 172,478 148,478 H52 C28,478 10,462 10,440 V182 C18,138 75,118 75,98 Z" fill="url(#oilNeem)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M25,190 V430" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.4"/>
    <g transform="translate(28, 210)">
      <rect x="0" y="0" width="144" height="185" rx="5" fill="#1E3A2B" stroke="#C8922B" stroke-width="1.8"/>
      <rect x="12" y="14" width="120" height="18" rx="2" fill="#FAF6EE"/>
      <text x="72" y="26" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="7.5" font-weight="bold" letter-spacing="1.2">MARACHEKKU NATURALS</text>
      <text x="72" y="76" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="13.5" font-weight="bold">TRADITIONAL NEEM</text>
      <text x="72" y="94" text-anchor="middle" fill="#C8922B" font-family="Georgia, serif" font-style="italic" font-size="10.5">Veppennai &amp; Iluppai</text>
      <line x1="30" y1="108" x2="114" y2="108" stroke="#C8922B" stroke-width="1"/>
      <text x="72" y="128" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="8" letter-spacing="0.8">WOOD-PRESSED SEED OIL</text>
      <text x="72" y="162" text-anchor="middle" fill="#C8922B" font-family="sans-serif" font-size="8.5" font-weight="bold">500 ML / 1 LITRE</text>
    </g>
  </g>
</svg>

