<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE0"/>
      <stop offset="60%" stop-color="#EADBC3"/>
      <stop offset="100%" stop-color="#D8C3A3"/>
    </linearGradient>
    <linearGradient id="oilMustard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A317"/>
      <stop offset="50%" stop-color="#BA730A"/>
      <stop offset="100%" stop-color="#7D4802"/>
    </linearGradient>
    <radialGradient id="glowMustard" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#FFC847" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#BA730A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7D4802" stop-opacity="0"/>
    </radialGradient>
    <filter id="prodShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgMustard)"/>
  <circle cx="400" cy="390" r="260" fill="#FFFDF8" opacity="0.5"/>

  <!-- Plinth -->
  <g filter="url(#prodShadow4)" transform="translate(130, 600)">
    <path d="M30,0 H510 L540,42 H0 Z" fill="#EDE2CE"/>
    <rect x="0" y="42" width="540" height="85" rx="4" fill="#D2C0A5"/>
    <line x1="0" y1="42" x2="540" y2="42" stroke="#FAF6EE" stroke-width="2"/>
  </g>

  <!-- Bottle of Cold-Pressed Mustard Oil -->
  <g filter="url(#prodShadow4)" transform="translate(275, 105)">
    <rect x="92" y="0" width="66" height="36" rx="8" fill="#2B1E16"/>
    <rect x="98" y="36" width="54" height="18" fill="#C8922B"/>
    <path d="M94,54 H156 V125 C156,150 225,175 235,228 V495 C235,522 214,540 186,540 H64 C36,540 15,522 15,495 V228 C25,175 94,150 94,125 Z" fill="url(#oilMustard)" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="125" cy="380" rx="75" ry="125" fill="url(#glowMustard)"/>
    <ellipse cx="125" cy="126" rx="30" ry="6" fill="#FFD966"/>
    <path d="M32,235 V485" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.45"/>
    <path d="M218,235 V485" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.35"/>

    <!-- Branded Label -->
    <g transform="translate(38, 250)">
      <rect x="0" y="0" width="174" height="215" rx="6" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="2"/>
      <rect x="6" y="6" width="162" height="203" rx="3" fill="none" stroke="#C8922B" stroke-width="1"/>
      <rect x="16" y="18" width="142" height="22" rx="3" fill="#1E3A2B"/>
      <text x="87" y="33" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="1.5">MARACHEKKU NATURALS</text>
      <circle cx="87" cy="68" r="16" fill="#F2EAD9" stroke="#C8922B" stroke-width="1.5"/>
      <path d="M87,57 C87,57 80,65 80,70 C80,74 83,77 87,77 C91,77 94,74 94,70 C94,65 87,57 87,57 Z" fill="#BA730A"/>
      <text x="87" y="108" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16.5" font-weight="bold">MUSTARD OIL</text>
      <text x="87" y="127" text-anchor="middle" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="11.5">Kadugu Ennai • Kachi Ghani</text>
      <line x1="40" y1="140" x2="134" y2="140" stroke="#C8922B" stroke-width="1.2"/>
      <text x="87" y="158" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="9" letter-spacing="1">WOOD-PRESSED • UNREFINED</text>
      <text x="87" y="175" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="8.5">Natural Pungency &amp; Aroma</text>
      <rect x="52" y="186" width="70" height="18" rx="9" fill="#F2EAD9"/>
      <text x="87" y="198" text-anchor="middle" fill="#1E3A2B" font-family="sans-serif" font-size="9" font-weight="bold">1 LITRE</text>
    </g>
  </g>

  <!-- Brass Bowls of Yellow & Black Mustard Seeds -->
  <g filter="url(#prodShadow4)" transform="translate(160, 582)">
    <path d="M0,14 H100 L88,52 H12 Z" fill="#C8922B"/>
    <ellipse cx="50" cy="14" rx="50" ry="12" fill="#E8B838"/>
    <g transform="translate(380, 5)">
      <path d="M0,14 H95 L84,48 H11 Z" fill="#A6761E"/>
      <ellipse cx="47" cy="14" rx="47" ry="11" fill="#3B2518"/>
    </g>
  </g>
</svg>

