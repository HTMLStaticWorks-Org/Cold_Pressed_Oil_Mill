<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="procBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6EFE2"/>
      <stop offset="100%" stop-color="#DFCDBA"/>
    </linearGradient>
    <linearGradient id="tinPack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8B9A6"/>
      <stop offset="35%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#9E8F7C"/>
    </linearGradient>
    <filter id="procShadow6" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#procBg6)"/>
  <rect x="0" y="425" width="800" height="135" fill="#4A3221"/>

  <!-- 15L Bulk Tin Can on Left -->
  <g filter="url(#procShadow6)" transform="translate(95, 110)">
    <path d="M85,18 V4 H145 V18" fill="none" stroke="#875E12" stroke-width="6" stroke-linecap="round"/>
    <rect x="10" y="22" width="210" height="315" rx="8" fill="url(#tinPack)" stroke="#A89882" stroke-width="2"/>
    <rect x="6" y="18" width="218" height="12" rx="3" fill="#C8922B"/>
    <rect x="6" y="328" width="218" height="12" rx="3" fill="#C8922B"/>
    <rect x="24" y="95" width="182" height="155" rx="5" fill="#1E3A2B" stroke="#C8922B" stroke-width="2"/>
    <text x="115" y="128" text-anchor="middle" fill="#C8922B" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="1.5">MARACHEKKU NATURALS</text>
    <text x="115" y="162" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="16" font-weight="bold">BULK SUPPLY TIN</text>
    <text x="115" y="185" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="10">5 LITRE • 15 LITRE</text>
    <rect x="60" y="205" width="110" height="24" rx="12" fill="#C8922B"/>
    <text x="115" y="221" text-anchor="middle" fill="#2B1E16" font-family="sans-serif" font-size="9.5" font-weight="bold">WHOLESALE PACK</text>
  </g>

  <!-- 1L & 500ml Glass Bottles on Right -->
  <g filter="url(#procShadow6)" transform="translate(375, 130)">
    <!-- 1L Bottle -->
    <rect x="52" y="0" width="38" height="22" rx="4" fill="#2B1E16"/>
    <path d="M54,22 H88 V68 C88,85 135,102 140,138 V300 C140,312 128,320 112,320 H30 C14,320 2,312 2,300 V138 C7,102 54,85 54,68 Z" fill="#E5A220" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="20" y="155" width="102" height="120" rx="4" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="1.5"/>
    <text x="71" y="185" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="7.5" font-weight="bold">MARACHEKKU</text>
    <text x="71" y="210" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="11.5" font-weight="bold">1L GLASS</text>
    <text x="71" y="232" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="8.5">TAMPER-SEALED</text>

    <!-- 500ml Bottle -->
    <g transform="translate(175, 45)">
      <rect x="42" y="0" width="32" height="18" rx="4" fill="#2B1E16"/>
      <path d="M44,18 H72 V56 C72,70 112,85 116,115 V255 C116,266 106,274 92,274 H24 C10,274 0,266 0,255 V115 C4,85 44,70 44,56 Z" fill="#C97812" stroke="#FFFFFF" stroke-width="2.5"/>
      <rect x="16" y="130" width="84" height="100" rx="4" fill="#1E3A2B" stroke="#C8922B" stroke-width="1.5"/>
      <text x="58" y="160" text-anchor="middle" fill="#C8922B" font-family="Georgia, serif" font-size="7" font-weight="bold">MARACHEKKU</text>
      <text x="58" y="184" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="10.5" font-weight="bold">500ML GLASS</text>
      <text x="58" y="205" text-anchor="middle" fill="#EBE0CB" font-family="sans-serif" font-size="8">RETAIL PACK</text>
    </g>
  </g>

  <!-- Step Badge -->
  <g transform="translate(40, 40)">
    <rect width="215" height="40" rx="20" fill="#1E3A2B"/>
    <text x="107" y="25" text-anchor="middle" fill="#FAF6EE" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">STEP 06 • PACKAGING</text>
  </g>
</svg>

