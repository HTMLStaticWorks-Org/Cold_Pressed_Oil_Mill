<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="stoneFlatlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EDE0"/>
      <stop offset="50%" stop-color="#E8DCC8"/>
      <stop offset="100%" stop-color="#D8C7AE"/>
    </linearGradient>
    <radialGradient id="brassRim" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2D078"/>
      <stop offset="55%" stop-color="#C8922B"/>
      <stop offset="100%" stop-color="#785314"/>
    </radialGradient>
    <radialGradient id="terracottaRim" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C8734B"/>
      <stop offset="60%" stop-color="#9B4E2B"/>
      <stop offset="100%" stop-color="#632E16"/>
    </radialGradient>
    <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Textured Warm Stone Background -->
  <rect width="1000" height="700" fill="url(#stoneFlatlay)"/>
  <rect x="36" y="36" width="928" height="628" rx="16" fill="none" stroke="#C8922B" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- BOWL 1 (Top Left): Red-Skin Groundnuts -->
  <g filter="url(#bowlShadow)" transform="translate(210, 205)">
    <circle cx="0" cy="0" r="118" fill="url(#brassRim)"/>
    <circle cx="0" cy="0" r="102" fill="#3D2618"/>
    <!-- Shelled Peanuts Pattern -->
    <g fill="#B35737" stroke="#7A341C" stroke-width="1.5">
      <ellipse cx="-45" cy="-35" rx="22" ry="14" transform="rotate(25 -45 -35)"/>
      <ellipse cx="10" cy="-50" rx="20" ry="13" transform="rotate(-15 10 -50)"/>
      <ellipse cx="52" cy="-25" rx="22" ry="14" transform="rotate(40 52 -25)"/>
      <ellipse cx="-55" cy="15" rx="21" ry="13" transform="rotate(-30 -55 15)"/>
      <ellipse cx="0" cy="0" rx="24" ry="15" transform="rotate(12 0 0)"/>
      <ellipse cx="48" cy="28" rx="22" ry="14" transform="rotate(-20 48 28)"/>
      <ellipse cx="-20" cy="52" rx="21" ry="14" transform="rotate(18 -20 52)"/>
      <ellipse cx="28" cy="60" rx="19" ry="12" transform="rotate(-10 28 60)"/>
    </g>
    <g fill="#E5C08D">
      <ellipse cx="-18" cy="-22" rx="18" ry="11" transform="rotate(-25 -18 -22)"/>
      <ellipse cx="32" cy="-5" rx="18" ry="11" transform="rotate(15 32 -5)"/>
      <ellipse cx="-25" cy="25" rx="19" ry="12" transform="rotate(35 -25 25)"/>
    </g>
    <text x="0" y="148" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16" font-weight="bold">Heirloom Groundnuts</text>
  </g>

  <!-- BOWL 2 (Top Center): Black & White Sesame (Gingelly) Seeds -->
  <g filter="url(#bowlShadow)" transform="translate(500, 205)">
    <circle cx="0" cy="0" r="118" fill="url(#terracottaRim)"/>
    <circle cx="0" cy="0" r="102" fill="#EBDCC3"/>
    <path d="M0,-102 A102,102 0 0,1 0,102 Z" fill="#2B2420"/>
    <!-- Sesame Seed Details -->
    <g fill="#FAF6EE">
      <ellipse cx="35" cy="-40" rx="5" ry="2.5" transform="rotate(20 35 -40)"/>
      <ellipse cx="55" cy="-15" rx="5" ry="2.5" transform="rotate(-30 55 -15)"/>
      <ellipse cx="28" cy="12" rx="5" ry="2.5" transform="rotate(15 28 12)"/>
      <ellipse cx="62" cy="25" rx="5" ry="2.5" transform="rotate(40 62 25)"/>
      <ellipse cx="35" cy="52" rx="5" ry="2.5" transform="rotate(-15 35 52)"/>
    </g>
    <g fill="#3B2A1E">
      <ellipse cx="-38" cy="-42" rx="5" ry="2.5" transform="rotate(-20 -38 -42)"/>
      <ellipse cx="-58" cy="-10" rx="5" ry="2.5" transform="rotate(25 -58 -10)"/>
      <ellipse cx="-30" cy="18" rx="5" ry="2.5" transform="rotate(-15 -30 18)"/>
      <ellipse cx="-55" cy="35" rx="5" ry="2.5" transform="rotate(35 -55 35)"/>
      <ellipse cx="-28" cy="55" rx="5" ry="2.5" transform="rotate(10 -28 55)"/>
    </g>
    <text x="0" y="148" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16" font-weight="bold">Black &amp; White Sesame</text>
  </g>

  <!-- BOWL 3 (Top Right): Sun-Dried Coconut Copra -->
  <g filter="url(#bowlShadow)" transform="translate(790, 205)">
    <circle cx="0" cy="0" r="118" fill="url(#brassRim)"/>
    <circle cx="0" cy="0" r="102" fill="#3A2516"/>
    <!-- Split Copra Cups -->
    <circle cx="-25" cy="-18" r="52" fill="#5C3B24"/>
    <circle cx="-25" cy="-18" r="42" fill="#FAF6EE"/>
    <circle cx="-25" cy="-18" r="26" fill="#E8DFD1"/>
    <circle cx="32" cy="24" r="48" fill="#5C3B24"/>
    <circle cx="32" cy="24" r="38" fill="#FAF6EE"/>
    <circle cx="32" cy="24" r="22" fill="#E8DFD1"/>
    <text x="0" y="148" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16" font-weight="bold">Sun-Dried Copra</text>
  </g>

  <!-- BOWL 4 (Bottom Left): Yellow & Black Mustard Seeds -->
  <g filter="url(#bowlShadow)" transform="translate(210, 500)">
    <circle cx="0" cy="0" r="118" fill="url(#terracottaRim)"/>
    <circle cx="0" cy="0" r="102" fill="#D9A129"/>
    <path d="M-72,-72 A102,102 0 0,1 72,72 Z" fill="#3B281E"/>
    <g fill="#F5CA52">
      <circle cx="25" cy="-35" r="4.5"/><circle cx="48" cy="-18" r="4.5"/><circle cx="15" cy="-10" r="4.5"/>
      <circle cx="55" cy="12" r="4.5"/><circle cx="32" cy="20" r="4.5"/><circle cx="65" cy="-5" r="4.5"/>
    </g>
    <g fill="#2A1B12">
      <circle cx="-35" cy="25" r="4.5"/><circle cx="-55" cy="5" r="4.5"/><circle cx="-18" cy="48" r="4.5"/>
      <circle cx="-48" cy="42" r="4.5"/><circle cx="-25" cy="12" r="4.5"/>
    </g>
    <text x="0" y="148" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16" font-weight="bold">Yellow &amp; Black Mustard</text>
  </g>

  <!-- BOWL 5 (Bottom Center): Golden Oil Decanter -->
  <g filter="url(#bowlShadow)" transform="translate(500, 500)">
    <circle cx="0" cy="0" r="118" fill="url(#brassRim)"/>
    <circle cx="0" cy="0" r="102" fill="#DF9E1E"/>
    <circle cx="-20" cy="-20" r="65" fill="#FCE27C" opacity="0.6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <text x="0" y="148" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="16" font-weight="bold">Unrefined Cold-Pressed Oil</text>
  </g>

  <!-- BOWL 6 (Bottom Right): Castor & Specialty Seeds -->
  <g filter="url(#bowlShadow)" transform="translate(790, 500)">
    <circle cx="0" cy="0" r="118" fill="url(#terracottaRim)"/>
    <circle cx="0" cy="0" r="102" fill="#422C1D"/>
    <!-- Mottled Castor Beans & Almonds -->
    <g fill="#7D4E32" stroke="#C8A682" stroke-width="1.5">
      <ellipse cx="-38" cy="-28" rx="18" ry="12" transform="rotate(30 -38 -28)"/>
      <ellipse cx="18" cy="-42" rx="18" ry="12" transform="rotate(-20 18 -42)"/>
      <ellipse cx="45" cy="-8" rx="18" ry="12" transform="rotate(15 45 -8)"/>
      <ellipse cx="-42" cy="22" rx="18" ry="12" transform="rotate(-25 -42 22)"/>
      <ellipse cx="0" cy="8" rx="19" ry="13" transform="rotate(10 0 8)"/>
      <ellipse cx="35" cy="38" rx="18" ry="12" transform="rotate(-35 35 38)"/>
      <ellipse cx="-12" cy="48" rx="18" ry="12" transform="rotate(20 -12 48)"/>
    </g>
    <text x="0" y="148" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16" font-weight="bold">Castor &amp; Specialty Seeds</text>
  </g>
</svg>

