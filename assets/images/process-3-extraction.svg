<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="procBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2017"/>
      <stop offset="100%" stop-color="#1D140E"/>
    </linearGradient>
    <linearGradient id="vagaiPress" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D2618"/>
      <stop offset="45%" stop-color="#69432B"/>
      <stop offset="100%" stop-color="#2D1B10"/>
    </linearGradient>
    <linearGradient id="pureOilFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="50%" stop-color="#E09F1F"/>
      <stop offset="100%" stop-color="#9E6808"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#procBg3)"/>
  <circle cx="400" cy="280" r="240" fill="#C8922B" opacity="0.12"/>

  <!-- Detailed Vagai Wood Chekku Extraction Close-Up -->
  <g transform="translate(180, 45)">
    <!-- Rotating Wooden Pestle (Ulakkai) with Motion Arc -->
    <path d="M120,75 A110,32 0 1,1 320,75" fill="none" stroke="#C8922B" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M235,0 C258,0 275,16 270,42 L230,225 L160,225 L202,32 C206,12 218,0 235,0 Z" fill="url(#vagaiPress)"/>
    <rect x="190" y="65" width="70" height="12" rx="3" transform="rotate(10 225 71)" fill="#C8922B"/>

    <!-- Vagai Mortar Bowl -->
    <ellipse cx="195" cy="225" rx="140" ry="30" fill="#23150C" stroke="#8C6239" stroke-width="4"/>
    <ellipse cx="195" cy="228" rx="115" ry="20" fill="#E5A524"/>
    <path d="M55,225 H335 L310,435 C306,455 288,468 265,468 H125 C102,468 84,455 80,435 L55,225 Z" fill="url(#vagaiPress)"/>
    <rect x="68" y="315" width="254" height="14" rx="4" fill="#C8922B"/>

    <!-- Oil Channel & Golden Oil Stream -->
    <path d="M300,355 L425,380 L418,404 L294,380 Z" fill="#C8922B"/>
    <path d="M415,392 Q445,402 448,445 L448,515 L430,515 L430,445 Q428,412 406,400 Z" fill="url(#pureOilFlow)"/>

    <!-- Ambient Temperature Callout Pill -->
    <g transform="translate(310, 120)">
      <rect x="0" y="0" width="250" height="72" rx="10" fill="#FAF6EE" stroke="#C8922B" stroke-width="2"/>
      <text x="125" y="28" text-anchor="middle" fill="#1E3A2B" font-family="Georgia, serif" font-size="14" font-weight="bold">Slow Rotational Crushing</text>
      <text x="125" y="50" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="11.5">14–16 RPM • Ambient Temp (&lt; 40°C)</text>
    </g>
  </g>

  <!-- Step Badge -->
  <g transform="translate(40, 40)">
    <rect width="235" height="40" rx="20" fill="#C8922B"/>
    <text x="117" y="25" text-anchor="middle" fill="#2B1E16" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">STEP 03 • CHEKKU PRESSING</text>
  </g>
</svg>

