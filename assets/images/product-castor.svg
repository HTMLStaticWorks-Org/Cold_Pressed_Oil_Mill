<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgCastor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EDE1"/>
      <stop offset="60%" stop-color="#E5D9C5"/>
      <stop offset="100%" stop-color="#D1C0A8"/>
    </linearGradient>
    <linearGradient id="oilCastor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF98"/>
      <stop offset="50%" stop-color="#D9B452"/>
      <stop offset="100%" stop-color="#A88225"/>
    </linearGradient>
    <filter id="prodShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#2B1E16" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgCastor)"/>
  <circle cx="400" cy="390" r="260" fill="#FFFDF8" opacity="0.5"/>

  <!-- Stone Plinth -->
  <g filter="url(#prodShadow5)" transform="translate(130, 600)">
    <path d="M30,0 H510 L540,42 H0 Z" fill="#EBE1D1"/>
    <rect x="0" y="42" width="540" height="85" rx="4" fill="#CFC0AA"/>
    <line x1="0" y1="42" x2="540" y2="42" stroke="#FAF6EE" stroke-width="2"/>
  </g>

  <!-- Apothecary Wide-Body Glass Bottle of Cold-Pressed Castor Oil -->
  <g filter="url(#prodShadow5)" transform="translate(265, 130)">
    <rect x="102" y="0" width="66" height="34" rx="6" fill="#2B1E16"/>
    <rect x="108" y="34" width="54" height="16" fill="#C8922B"/>
    <path d="M104,50 H166 V100 C166,125 242,140 248,195 V475 C248,500 228,515 200,515 H70 C42,515 22,500 22,475 V195 C28,140 104,125 104,100 Z" fill="url(#oilCastor)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M40,205 V465" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-opacity="0.55"/>
    <path d="M230,205 V465" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Branded Label -->
    <g transform="translate(48, 220)">
      <rect x="0" y="0" width="174" height="215" rx="6" fill="#FAF6EE" stroke="#1E3A2B" stroke-width="2"/>
      <rect x="6" y="6" width="162" height="203" rx="3" fill="none" stroke="#C8922B" stroke-width="1"/>
      <rect x="16" y="18" width="142" height="22" rx="3" fill="#1E3A2B"/>
      <text x="87" y="33" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="9" font-weight="bold" letter-spacing="1.5">MARACHEKKU NATURALS</text>
      <circle cx="87" cy="68" r="16" fill="#F2EAD9" stroke="#C8922B" stroke-width="1.5"/>
      <path d="M87,57 C87,57 80,65 80,70 C80,74 83,77 87,77 C91,77 94,74 94,70 C94,65 87,57 87,57 Z" fill="#C8922B"/>
      <text x="87" y="108" text-anchor="middle" fill="#2B1E16" font-family="Georgia, serif" font-size="16.5" font-weight="bold">CASTOR OIL</text>
      <text x="87" y="127" text-anchor="middle" fill="#5C7052" font-family="Georgia, serif" font-style="italic" font-size="11.5">Amanakku / Vilakkennai</text>
      <line x1="40" y1="140" x2="134" y2="140" stroke="#C8922B" stroke-width="1.2"/>
      <text x="87" y="158" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="9" letter-spacing="1">WOOD-PRESSED • THICK GRADE</text>
      <text x="87" y="175" text-anchor="middle" fill="#5A4A3E" font-family="sans-serif" font-size="8.5">Traditional Heirloom Castor</text>
      <rect x="52" y="186" width="70" height="18" rx="9" fill="#F2EAD9"/>
      <text x="87" y="198" text-anchor="middle" fill="#1E3A2B" font-family="sans-serif" font-size="9" font-weight="bold">500 ML</text>
    </g>
  </g>

  <!-- Mottled Castor Seeds on Plinth -->
  <g filter="url(#prodShadow5)" transform="translate(185, 602)">
    <g fill="#6B3F26" stroke="#C8A882" stroke-width="1.5">
      <ellipse cx="25" cy="22" rx="14" ry="9" transform="rotate(-15 25 22)"/>
      <ellipse cx="55" cy="28" rx="14" ry="9" transform="rotate(20 55 28)"/>
      <ellipse cx="82" cy="20" rx="14" ry="9" transform="rotate(-8 82 20)"/>
      <ellipse cx="365" cy="24" rx="14" ry="9" transform="rotate(15 365 24)"/>
      <ellipse cx="395" cy="28" rx="14" ry="9" transform="rotate(-22 395 28)"/>
    </g>
  </g>
</svg>

